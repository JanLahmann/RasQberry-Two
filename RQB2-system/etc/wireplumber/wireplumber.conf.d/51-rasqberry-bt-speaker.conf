# RasQberry plays sound on Bluetooth speakers; it is not a Bluetooth speaker
# itself. Without the A2DP sink role, a speaker that can also send sound (the
# Jabra Speak 710, for one) no longer connects the wrong way round, as a source
# whose sound the Pi plays, and offers only "Audio Gateway" with no way to
# play on it (2026-10-13).
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_source hfp_ag hsp_ag ]
}
