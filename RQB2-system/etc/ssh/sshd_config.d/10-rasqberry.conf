# RasQberry: no "Last login" line at the SSH login (user test 2026-10-04, #31).
# On this Pi the last login is mostly the console autologin at start-up
# (tty1, part of "boot to desktop"). At the first start its time is the image
# build's, because the clock is set from the network only later, so a fresh
# card said "Last login: <a time when nobody used it>".
# Delete this file to see the line again.
PrintLastLog no
