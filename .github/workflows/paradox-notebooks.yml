name: Quantum Paradoxes notebooks

# Runs the patched Quantum Paradoxes notebooks and compares every circuit's exact
# outcome probabilities with the values recorded from Maria Violaris' originals
# (tests/paradoxes, #181). Here: when the patch rules or the test change.
# The weekly run against the latest Qiskit lives on main (it checks out
# development), because scheduled workflows only run from the default branch.

on:
  push:
    branches: ['development', 'beta', 'dev*']
    paths:
      - 'RQB2-bin/setup_quantum_paradoxes.py'
      - 'RQB2-config/demo-manifests/rq_demo_quantum-paradoxes.json'
      - 'tests/paradoxes/**'
      - '.github/workflows/paradox-notebooks.yml'
  workflow_dispatch:

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'   # the image's Python
      - name: Install the Qiskit/Jupyter stack (latest, as the image does)
        run: |
          python -m pip install --upgrade pip
          pip install qiskit qiskit-aer qiskit-ibm-runtime nbclient nbformat \
                      ipykernel matplotlib pylatexenc pytest
          pip list | grep -iE '^qiskit'
      - name: Run the notebooks and compare
        run: python -m pytest -v tests/paradoxes
